[package]
name = "tipsy-isle"
version = "1.1.5"
license = "Apache-2.0"
description = "TipsyIsle — A local AI roleplay client built on an independent architecture for players, creators, and developers"
authors = ["TipsyIsle contributors"]
edition = "2021"

[lib]
name = "tipsy_isle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.37", features = ["bundled"] }
tiny_http = "0.12"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(any(target_os = "windows", target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semver = "1"
tokio = { version = "1", features = ["fs", "io-util"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
