[package]
name = "tipsy-isle"
version = "1.0.0"
description = "微醺屿 (TipsyIsle) — 为 AIRP 玩家与社区生态打造的本地角色扮演客户端"
authors = ["TipsyIsle contributors"]
edition = "2021"

[lib]
name = "tipsy_isle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.37", features = ["bundled"] }
tiny_http = "0.12"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
